<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nico - Galáxia de Memórias</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  #starfield {
    position: absolute; inset: 0; z-index: 0;
    background: var(--bg-glow), var(--bg);
  }
  #galaxy {
    position: absolute; inset: 0; z-index: 1;
    background: transparent;
  }

  #topbar {
    position: absolute; top: 16px; left: 16px; right: 16px;
    display: flex; align-items: center; gap: 12px; z-index: 5;
    flex-wrap: wrap;
  }
  #topbar .panel { padding: 8px 14px; display:flex; align-items:center; gap:10px; }
  #count { color: var(--muted); font-size: 0.85em; white-space: nowrap; }
  #search { width: 220px; }

  #detail {
    position: absolute; bottom: 16px; left: 16px; right: 16px;
    max-width: 640px;
    padding: 14px 18px;
    display: none;
    z-index: 5;
  }
  #detail .you { color: var(--accent); margin-bottom: 6px; }
  #detail .nico { color: var(--c-speaking); }
  #detail .close { float: right; cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
  <div id="starfield"></div>
  <div id="galaxy"></div>

  <div id="topbar">
    <div class="panel"><a href="/">&larr; voltar</a></div>
    <div class="panel"><input type="text" id="search" placeholder="Buscar na galáxia..."></div>
    <div class="panel"><span id="count">carregando...</span></div>
  </div>

  <div id="detail" class="panel">
    <span class="close" onclick="closeDetail()">&times;</span>
    <div class="you" id="detail-q"></div>
    <div class="nico" id="detail-a"></div>
  </div>

<script src="/assets/starfield.js"></script>
<script src="/assets/galaxy.js"></script>
</body>
</html>
