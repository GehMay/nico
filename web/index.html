<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nico</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { display:flex; align-items:stretch; padding:0; overflow:hidden; }
  .island {
    width:100%; height:100%; display:grid;
    grid-template-columns:72px 1fr 38px 30px;
    grid-template-rows:72px 1fr 38px; gap:8px;
    padding:12px; border:1px solid var(--border); border-radius:22px;
    background:linear-gradient(145deg, rgba(18,24,43,.98), rgba(5,6,10,.98));
    box-shadow:0 12px 34px #0009;
  }
  h1.title { font-size:.95em; color:var(--accent); margin:0 0 6px; }
  .orb-wrap { position:relative; width:72px; height:72px; grid-area:1 / 1 / 2 / 2; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.6s ease;
  }
  #ring-outer { inset:0; animation:spin 9s linear infinite; }
  #ring-mid { inset:8px; animation:spin 6s linear infinite reverse; }
  #ring-inner { inset:16px; animation:spin 4s linear infinite; }

  #core {
    position:absolute; inset:25px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff33, var(--c-idle) 70%);
    box-shadow:0 0 18px 3px var(--c-idle), 0 0 32px 8px transparent;
    transition: background 0.6s ease, box-shadow 0.6s ease, transform 0.3s ease;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .identity { grid-area:1 / 2 / 2 / 3; align-self:center; min-width:0; }
  #status-text {
    font-family: 'Orbitron', sans-serif;
    letter-spacing:.08em;
    font-size:.68em;
    color: var(--accent);
    min-height:1.4em;
    text-transform: uppercase;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #mic-toggle {
    grid-area:1 / 3 / 2 / 4; width:38px; height:38px; padding:0;
    align-self:center; font-size:1.1em;
  }
  #mic-toggle.paused {
    background: var(--panel);
    border: 1px solid var(--c-error);
    color: var(--c-error);
  }
  #close-button {
    grid-area:1 / 4 / 2 / 5; width:30px; height:30px; padding:0;
    align-self:center; background:transparent; color:var(--muted); font-size:1.2em;
  }
  #close-button:hover { color:var(--c-error); }
  #transcript {
    grid-area:2 / 1 / 3 / 5; min-height:0; overflow-y:auto;
    padding:6px 9px; border-radius:8px; font-size:.76em;
  }
  .entry { margin-bottom:4px; opacity:0; animation:fadein .3s ease forwards; }
  .entry .you { color: var(--accent); }
  .entry .nico { color: var(--c-speaking); }
  .row { grid-area:3 / 1 / 4 / 5; display:flex; gap:8px; min-width:0; }
  .row input[type=text] { flex:1; min-width:0; padding:8px 10px; font-size:.82em; }
  .row button { padding:7px 10px; font-size:.7em; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <main class="island">
    <div class="orb-wrap">
      <div class="ring" id="ring-outer"></div>
      <div class="ring" id="ring-mid"></div>
      <div class="ring" id="ring-inner"></div>
      <div id="core"></div>
    </div>
    <div class="identity">
      <h1 class="title">NICO</h1>
      <div id="status-text">INICIANDO</div>
    </div>
    <button id="mic-toggle" title="Pausar ou ativar o microfone">
      <span id="mic-icon">🎤</span>
      <span id="mic-label" hidden>MICROFONE LIGADO</span>
    </button>
    <button id="close-button" title="Esconder (o Nico continua ouvindo)">×</button>
    <div id="transcript" class="panel"></div>
    <div class="row">
      <input type="text" id="cmd" placeholder="Digite um comando...">
      <button id="send-button">ENVIAR</button>
    </div>
  </main>

<script src="/assets/hud.js"></script>
</body>
</html>
