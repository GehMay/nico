<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nico</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; }
  h1.title { font-size: 1.1em; color: var(--accent); margin: 4px 0 24px; }

  .orb-wrap { position: relative; width: 260px; height: 260px; margin-bottom: 18px; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.6s ease;
  }
  #ring-outer { inset: 0; animation: spin 9s linear infinite; }
  #ring-mid { inset: 22px; animation: spin 6s linear infinite reverse; }
  #ring-inner { inset: 44px; animation: spin 4s linear infinite; }

  #core {
    position: absolute; inset: 80px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff33, var(--c-idle) 70%);
    box-shadow: 0 0 30px 6px var(--c-idle), 0 0 70px 20px transparent;
    transition: background 0.6s ease, box-shadow 0.6s ease, transform 0.3s ease;
    animation: breathe 3.2s ease-in-out infinite;
  }

  #status-text {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.3em;
    font-size: 0.95em;
    color: var(--accent);
    margin-bottom: 20px;
    min-height: 1.4em;
    text-transform: uppercase;
  }

  #transcript {
    width: min(560px, 92vw);
    max-height: 34vh;
    overflow-y: auto;
    padding: 14px;
    margin-bottom: 16px;
  }
  .entry { margin-bottom: 10px; opacity: 0; animation: fadein 0.4s ease forwards; }
  .entry .you { color: var(--accent); }
  .entry .nico { color: var(--c-speaking); }

  .row { width: min(560px, 92vw); display: flex; gap: 10px; }
  .row input[type=text] { flex: 1; }

  .links { margin-top: 18px; font-size: 0.9em; color: var(--muted); }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <h1 class="title">N I C O</h1>

  <div class="orb-wrap">
    <div class="ring" id="ring-outer"></div>
    <div class="ring" id="ring-mid"></div>
    <div class="ring" id="ring-inner"></div>
    <div id="core"></div>
  </div>

  <div id="status-text">STARTING</div>

  <div id="transcript" class="panel"></div>

  <div class="row">
    <input type="text" id="cmd" placeholder="Type a command for Nico...">
    <button onclick="sendCommand()">SEND</button>
  </div>

  <div class="links"><a href="/memory">Open memory galaxy &rarr;</a></div>

<script src="/assets/hud.js"></script>
</body>
</html>
